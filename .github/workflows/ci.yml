name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The installed toolchain only: setup.sh skips every step whose output is present, so its
      # downloads (~700 MB) need not be cached as well.
      - name: Cache the Blender toolchain
        uses: actions/cache@v4
        with:
          path: |
            .blender
            !.blender/downloads
          key: blender-${{ runner.os }}-${{ hashFiles('tools/blender/versions.env') }}

      - name: Install Blender's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6

      - name: Set up the Blender toolchain
        run: npm run blender:setup

      - name: Fetch dev sample VRMs and build assets
        run: npm run assets:dev

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint, typecheck, unit tests, build, e2e
        run: npm run ci
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
