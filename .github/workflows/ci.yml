name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The installed toolchain only: setup.sh skips every step whose output is present, so its
      # downloads (~700 MB) need not be cached as well. Restored here, saved right after setup.
      - name: Restore the Blender toolchain
        id: blender-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .blender
            !.blender/downloads
          key: blender-${{ runner.os }}-${{ hashFiles('tools/blender/versions.env') }}

      - name: Install Blender's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6

      - name: Set up the Blender toolchain
        run: npm run blender:setup

      # Saved as soon as setup has run, even when it or a later step fails, so that the next run need not
      # download again; skipped on an exact-key hit, which is saved already (a cache key is never
      # overwritten).
      - name: Save the Blender toolchain
        if: always() && steps.blender-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .blender
            !.blender/downloads
          key: ${{ steps.blender-cache.outputs.cache-primary-key }}

      - name: Build assets
        run: npm run assets:dev

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint, typecheck, unit tests, build, e2e
        run: npm run ci
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
